# Pings the backend's /health endpoint twice a week so the free Supabase project
# (auto-pauses after 7 days idle) stays active.
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#   Name: BACKEND_URL   Value: your Render URL, e.g. https://sat-backend.onrender.com
name: Keep demo alive

on:
  schedule:
    - cron: "0 14 * * 1,4"   # Mondays and Thursdays, 14:00 UTC
  workflow_dispatch:         # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health check
        run: |
          # Render's free tier can take ~1 minute to wake up, so allow retries
          curl --fail --silent --show-error --retry 5 --retry-delay 20 --retry-all-errors \
               --max-time 90 "${{ secrets.BACKEND_URL }}/health"
